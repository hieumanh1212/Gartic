name: Deploy server lên Cloudflare

# Tùy chọn: tự deploy server khi sửa code server.
# Cần secret CLOUDFLARE_API_TOKEN (quyền "Edit Cloudflare Workers"). Không có secret thì job tự bỏ qua.
on:
  push:
    branches: [main]
    paths: ['server/**', 'shared/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.CF_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CF_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm test
        if: env.CF_TOKEN != ''
      - run: npx wrangler deploy
        if: env.CF_TOKEN != ''
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
